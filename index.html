
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10051f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Lucky Jet</title>
  <meta name="description" content="Instalează Lucky Jet pe telefonul tău.">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at top, #521078, transparent 60%),
        linear-gradient(160deg, #10051f, #07030d);
    }

    .app {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 145px;
      height: 145px;
      object-fit: contain;
      border-radius: 28px;
      filter: drop-shadow(0 0 24px #d000ff88);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      color: #ff43e8;
      text-shadow: 0 0 16px #d000ff;
    }

    .subtitle {
      color: #ded0ec;
      margin: 12px 0 28px;
      font-size: 15px;
      line-height: 1.5;
    }

    .install {
      display: block;
      width: 100%;
      padding: 19px 12px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(100deg, #ff27d7, #8d32ff);
      color: white;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 25px #c000ff66;
    }

    .guide {
      display: none;
      margin-top: 24px;
      padding: 20px;
      text-align: left;
      border: 1px solid #a53dff;
      border-radius: 18px;
      background: #190b2a;
    }

    .guide.show { display: block; }

    .guide h2 {
      text-align: center;
      color: #ff5ce8;
      font-size: 21px;
    }

    .step {
      margin: 12px 0;
      padding: 13px;
      border-radius: 12px;
      background: #29123c;
      line-height: 1.6;
      font-size: 14px;
    }

    .number {
      color: #ff59e8;
      font-weight: 900;
    }

    .browser-link {
      display: block;
      margin-top: 18px;
      padding: 15px 12px;
      border-radius: 12px;
      background: linear-gradient(100deg, #ff27d7, #8d32ff);
      color: white;
      text-align: center;
      font-weight: 900;
      text-decoration: none;
    }

    .note {
      color: #cbb9dc;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 24px;
      color: #9d89b1;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="app">
    <img
      class="logo"
      src="./icons/icon-192.png"
      alt="Lucky Jet"
      onerror="this.style.display='none'"
    >

    <h1>LUCKY JET</h1>

    <p class="subtitle">
      Instalează aplicația pe ecranul telefonului tău.
    </p>

    <button class="install" id="installBtn" type="button">
      📲 INSTALEAZĂ APLICAȚIA
    </button>

    <section class="guide" id="guide" aria-live="polite"></section>

    <div class="footer">LUCKY JET · INSTALARE PE TELEFON</div>
  </main>

  <script>
    const APP_URL =
      "https://arikrat722-coder.github.io/My.pewa.app/";

    const button = document.getElementById("installBtn");
    const guide = document.getElementById("guide");

    function showGuide() {
      guide.innerHTML = `
        <h2>Deschide în Safari</h2>

        <div class="step">
          <span class="number">PASUL 1</span><br>
          Apasă butonul de mai jos pentru a deschide pagina Lucky Jet.
        </div>

        <a class="browser-link"
           href="${APP_URL}?install=1"
           target="_blank"
           rel="noopener">
          🌐 DESCHIDE PAGINA ÎN BROWSER
        </a>

        <div class="step">
          <span class="number">PASUL 2</span><br>
          Dacă pagina se deschide în Telegram, intră în meniul acestuia
          și alege „Deschide în Safari”, dacă opțiunea este disponibilă.
        </div>

        <div class="step">
          <span class="number">PASUL 3</span><br>
          În Safari, apasă „Partajare” — pătratul cu săgeata în sus.
        </div>

        <div class="step">
          <span class="number">PASUL 4</span><br>
          Alege „Adaugă pe ecranul principal”, apoi apasă „Adaugă”.
        </div>

        <p class="note">
          Pe iPhone, instalarea trebuie confirmată de utilizator.
          Un site nu poate forța Safari să se deschidă din Telegram.
        </p>
      `;

      guide.classList.add("show");
      guide.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    button.addEventListener("click", showGuide);

    // Afișează automat ghidul când pagina este deschisă
    // cu parametrul ?install=1.
    const params = new URLSearchParams(window.location.search);

    if (params.get("install") === "1") {
      showGuide();
    }

    // Înregistrarea PWA existente.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => console.error("Service worker:", error));
      });
    }
  </script>
</body>
</html>
