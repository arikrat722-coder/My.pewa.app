<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Lucky Jet</title>
  <meta name="description" content="Deschide platforma Lucky Jet.">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .app {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: linear-gradient(135deg, #ff4545, #9b111e);
      font-size: 42px;
      box-shadow: 0 0 40px #ff303033;
    }

    .tag {
      color: #ff626a;
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 700;
    }

    h1 {
      margin: 12px 0;
      font-size: 34px;
      letter-spacing: 1px;
    }

    p {
      color: #b0b0bd;
      font-size: 15px;
      line-height: 1.7;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px;
      margin-top: 28px;
      border: 0;
      border-radius: 14px;
      background: #f04452;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:active {
      opacity: 0.8;
    }

    .note {
      margin-top: 24px;
      color: #777784;
      font-size: 11px;
      line-height: 1.6;
    }

    #install-help {
      margin-top: 12px;
      color: #f5c85b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">✈️</div>

    <div class="tag">APLICAȚIA TA</div>

    <h1>LUCKY JET</h1>

    <p>
      Adaugă aplicația pe ecranul telefonului pentru acces rapid și ușor.
    </p>

    <!-- Doar butonul de instalare -->
    <button id="install-btn" class="button">
      📲 INSTALARE APLICAȚIE
    </button>
    <p id="install-help"></p>

    <div class="note">
      Jocurile de noroc implică riscuri financiare.
      Participă numai dacă ai vârsta legală și joacă responsabil.
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Service worker registration failed:", error);
        });
      });
    }

    let installPrompt;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
    });

    document.getElementById("install-btn").addEventListener("click", async () => {
      const help = document.getElementById("install-help");

      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        return;
      }

      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

      if (isIOS) {
        help.textContent =
          "Pe iPhone: deschide pagina în Safari, apasă butonul Partajare și apoi «Adaugă pe ecranul principal».";
      } else {
        help.textContent =
          "Dacă nu apare pop-up-ul, deschide meniul browserului (cele 3 puncte) și alege «Instalează aplicația».";
      }
    });
  </script>
</body>
</html>
